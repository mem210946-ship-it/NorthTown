<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>North Town Panel</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: linear-gradient(180deg, #c46a32 0%, #8a4a24 45%, #1a1a1a 100%);
            color: white;
            display: flex;
            animation: fadeIn 1s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .sidebar {
            width: 220px;
            background: rgba(0,0,0,0.40);
            height: 100vh;
            padding-top: 20px;
            position: fixed;
            right: 0;
            top: 0;
            border-left: 3px solid #c46a32;
            backdrop-filter: blur(4px);
            animation: slideRight 0.6s ease;
        }

        @keyframes slideRight {
            from { transform: translateX(25px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        .sidebar a {
            display: block;
            padding: 15px;
            color: #f3c7a3;
            text-decoration: none;
            font-size: 18px;
            border-bottom: 1px solid #222;
            text-align: center;
            transition: 0.25s;
        }

        .sidebar a:hover {
            background: #c46a32;
            color: #111;
        }

        .content {
            margin-right: 240px;
            padding: 20px;
            width: 100%;
            animation: fadeIn 1.2s ease;
        }

        .header-img {
            width: 100%;
            height: 300px;
            object-fit: cover;
            border-bottom: 3px solid #c46a32;
            animation: fadeIn 1.4s ease;
        }

        h1 {
            color: #f3c7a3;
            text-align: center;
            animation: fadeIn 1.2s ease;
        }

        table {
            width: 60%;
            margin: 20px auto;
            border-collapse: collapse;
            background: rgba(0,0,0,0.30);
            backdrop-filter: blur(3px);
            animation: fadeIn 1.4s ease;
        }

        th, td {
            padding: 12px;
            border: 1px solid #444;
            text-align: center;
            transition: 0.25s;
        }

        tr:hover td {
            background: #c46a32;
            color: #111;
        }
    </style>

    <script>
        function showSection(id) {
            document.getElementById("developer").style.display = "none";
            document.getElementById("server").style.display = "none";

            const section = document.getElementById(id);
            section.style.display = "block";
            section.style.animation = "fadeIn 0.6s ease";
        }
    </script>
</head>

<body>

    <div class="sidebar">
        <a href="#" onclick="showSection('developer')">Website Developer</a>
        <a href="#" onclick="showSection('server')">Server Owners</a>
    </div>

    <div class="content">

        <!-- الصورة الجديدة -->
        <img src="https://cdn.discordapp.com/attachments/1355255379612664028/1524685418162028544/lklkl.png?ex=6a50a572&is=6a4f53f2&hm=f7d756f328bbe1b359f8e292068a4f234e03138dce597e0ddd8808e8e249dbde" class="header-img">

        <div id="developer">
            <h1>Website Developer</h1>

            <table>
                <tr>
                    <th>Discord User</th>
                    <th>Nickname</th>
                    <th>Name</th>
                </tr>
                <tr>
                    <td>fromirq</td>
                    <td>Tabot</td>
                    <td>Ali</td>
                </tr>
            </table>
        </div>

        <div id="server" style="display:none;">
            <h1>Server Owners</h1>

            <table>
                <tr>
                    <th>Name</th>
                    <th>Discord User</th>
                    <th>Rank</th>
                </tr>
                <tr>
                    <td>Loka</td>
                    <td>7.yv</td>
                    <td>Owner</td>
                </tr>
            </table>
        </div>

    </div>

</body>
</html>
