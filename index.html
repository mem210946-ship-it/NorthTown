<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>North Town Style</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: linear-gradient(180deg, #c46a32 0%, #8a4a24 40%, #1a1a1a 100%);
            color: white;
            display: flex;
            animation: fadeIn 1.2s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .sidebar {
            width: 220px;
            background: rgba(0,0,0,0.45);
            height: 100vh;
            padding-top: 20px;
            position: fixed;
            right: 0;
            top: 0;
            border-left: 3px solid #ffd2a3;
            backdrop-filter: blur(6px);
            animation: slideRight 0.8s ease;
        }

        @keyframes slideRight {
            from { transform: translateX(40px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        .sidebar a {
            display: block;
            padding: 15px;
            color: #ffd2a3;
            text-decoration: none;
            font-size: 18px;
            border-bottom: 1px solid #222;
            text-align: center;
            transition: 0.3s;
        }

        .sidebar a:hover {
            background: #ffd2a3;
            color: #111;
            transform: scale(1.05);
        }

        .content {
            margin-right: 240px;
            padding: 20px;
            width: 100%;
            animation: fadeIn 1.5s ease;
        }

        .header-img {
            width: 100%;
            height: 300px;
            object-fit: cover;
            border-bottom: 3px solid #ffd2a3;
            animation: fadeIn 1.8s ease;
        }

        h1 {
            color: #ffd2a3;
            text-align: center;
            animation: fadeIn 1.5s ease;
            text-shadow: 0 0 10px rgba(255, 150, 80, 0.6);
        }

        table {
            width: 60%;
            margin: 20px auto;
            border-collapse: collapse;
            background: rgba(0,0,0,0.35);
            backdrop-filter: blur(4px);
            animation: fadeIn 2s ease;
        }

        th, td {
            padding: 12px;
            border: 1px solid #444;
            text-align: center;
            transition: 0.3s;
        }

        tr:hover td {
            background: #ffd2a3;
            color: #111;
            transform: scale(1.02);
        }
    </style>

    <script>
        function showSection(id) {
            document.getElementById("programmer").style.display = "none";
            document.getElementById("server").style.display = "none";

            const section = document.getElementById(id);
            section.style.display = "block";
            section.style.animation = "fadeIn 0.8s ease";
        }
    </script>
</head>

<body>

    <div class="sidebar">
        <a href="#" onclick="showSection('programmer')">مبرمج الموقع</a>
        <a href="#" onclick="showSection('server')">رئاسة السيرفر</a>
    </div>

    <div class="content">

        <img src="header.jpg" class="header-img">

        <div id="programmer">
            <h1>مبرمج الموقع</h1>

            <table>
                <tr>
                    <th>Discord User</th>
                    <th>Nickname</th>
                    <th>Name</th>
                </tr>
                <tr>
                    <td>fromirq</td>
                    <td>Tabot</td>
                    <td>Ali</td>
                </tr>
            </table>
        </div>

        <div id="server" style="display:none;">
            <h1>رئاسة السيرفر</h1>

            <table>
                <tr>
                    <th>Name</th>
                    <th>Discord User</th>
                    <th>Rank</th>
                </tr>
                <tr>
                    <td>Loka</td>
                    <td>7.yv</td>
                    <td>Owner</td>
                </tr>
            </table>
        </div>

    </div>

</body>
</html>
